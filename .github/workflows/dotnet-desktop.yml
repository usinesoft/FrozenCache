name: .NET Build, Test, and AOT Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test FrozenCache/UnitTests/UnitTests.csproj -c ${{ matrix.configuration }}

  publish-aot:
    needs: test

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Native AOT on Linux links via clang; the Windows runner already has the MSVC toolchain preinstalled.
    - name: Install native AOT prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish FrozenCache (${{ matrix.rid }})
      run: dotnet publish FrozenCache/FrozenCache/FrozenCache.csproj -c Release -r ${{ matrix.rid }} -f net10.0 --self-contained -o publish/${{ matrix.rid }}/FrozenCache

    - name: Publish PerTest (${{ matrix.rid }})
      run: dotnet publish FrozenCache/PerTest/PerTest.csproj -c Release -r ${{ matrix.rid }} -f net10.0 --self-contained -o publish/${{ matrix.rid }}/PerTest

    - name: Upload ${{ matrix.rid }} binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}-binaries
        path: publish/${{ matrix.rid }}

  publish-portable:
    needs: test

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Framework-dependent, RID-less (AnyCPU) build: requires the .NET 10 runtime (ASP.NET Core runtime for the
    # server) on the target machine and runs on any OS/architecture via `dotnet FrozenCache.dll`.
    - name: Publish FrozenCache (portable)
      run: dotnet publish FrozenCache/FrozenCache/FrozenCache.csproj -c Release -f net10.0 -p:PublishAot=false -p:UseAppHost=false -o publish/portable/FrozenCache

    - name: Publish PerTest (portable)
      run: dotnet publish FrozenCache/PerTest/PerTest.csproj -c Release -f net10.0 -p:PublishAot=false -p:UseAppHost=false -o publish/portable/PerTest

    - name: Upload portable binaries
      uses: actions/upload-artifact@v4
      with:
        name: portable-binaries
        path: publish/portable
