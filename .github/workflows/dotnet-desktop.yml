name: .NET Build, Test, and AOT Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # MTP mode of dotnet test, enabled by global.json at the repository root. Coverage (coverlet.MTP) is only
    # collected for Debug: optimized Release code maps poorly to source lines.
    - name: Execute unit tests
      run: >-
        dotnet test --project FrozenCache/UnitTests/UnitTests.csproj -c ${{ matrix.configuration }}
        ${{ matrix.configuration == 'Debug' && '--coverlet --coverlet-output-format opencover --coverlet-output-format cobertura --coverlet-file-prefix UnitTests --results-directory coverage' || '' }}

    - name: Upload coverage report
      if: matrix.configuration == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/*.xml

  # Rust client (rust/): lint, protocol tests, then end-to-end tests against the real .NET server, plain and TLS
  rust:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Protocol tests
      run: cargo test --workspace

    - name: Start .NET servers (two plain, one TLS)
      working-directory: .
      run: |
        dotnet build FrozenCache/FrozenCache/FrozenCache.csproj -c Release -p:SkipDashboard=true
        dotnet dev-certs https -ep "$RUNNER_TEMP/test-cert.pfx" -p test-password
        SERVER=FrozenCache/FrozenCache/bin/Release/net10.0/FrozenCache
        start_server() { # port http-port ssl
          ServerSettings__Port=$1 ServerSettings__UseSsl=$3 \
          ServerSettings__SslCertificatePath="$RUNNER_TEMP/test-cert.pfx" ServerSettings__SslCertificatePassword=test-password \
          Kestrel__Endpoints__MyHttpEndpoint__Url=http://localhost:$2 \
          PathSettings__DataPath="$RUNNER_TEMP/data-$1" PathSettings__LogPath="$RUNNER_TEMP/logs-$1" \
          nohup "$SERVER" > "$RUNNER_TEMP/server-$1.log" 2>&1 &
        }
        start_server 5123 5213 false
        start_server 5124 5214 true
        start_server 5125 5215 false
        for port in 5123 5124 5125; do
          for i in $(seq 1 60); do nc -z localhost $port && break; sleep 1; done
          nc -z localhost $port || { cat "$RUNNER_TEMP/server-$port.log"; exit 1; }
        done

    - name: End-to-end tests (plain)
      run: cargo test -p frozencache-client --test dotnet_server
      env:
        FROZENCACHE_TEST_SERVER: localhost:5123

    - name: End-to-end tests (TLS)
      run: cargo test -p frozencache-client --test dotnet_server
      env:
        FROZENCACHE_TEST_SERVER: localhost:5124
        FROZENCACHE_TEST_TLS: "1"

    - name: End-to-end tests (Aggregator, two replicas)
      run: cargo test -p frozencache-client --test aggregator
      env:
        FROZENCACHE_TEST_SERVERS: localhost:5123+localhost:5125

    - name: Server logs
      if: failure()
      working-directory: .
      run: cat "$RUNNER_TEMP"/server-*.log

  publish-aot:
    needs: test

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # building the server builds the Angular dashboard (FrozenCache/Dashboard)
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: FrozenCache/Dashboard/package-lock.json

    # Native AOT on Linux links via clang; the Windows runner already has the MSVC toolchain preinstalled.
    - name: Install native AOT prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish FrozenCache (${{ matrix.rid }})
      run: dotnet publish FrozenCache/FrozenCache/FrozenCache.csproj -c Release -r ${{ matrix.rid }} -f net10.0 --self-contained -o publish/${{ matrix.rid }}/FrozenCache

    - name: Publish PerfTest (${{ matrix.rid }})
      run: dotnet publish FrozenCache/PerfTest/PerfTest.csproj -c Release -r ${{ matrix.rid }} -f net10.0 --self-contained -o publish/${{ matrix.rid }}/PerfTest

    - name: Upload ${{ matrix.rid }} binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}-binaries
        path: publish/${{ matrix.rid }}

  publish-portable:
    needs: test

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # building the server builds the Angular dashboard (FrozenCache/Dashboard)
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: FrozenCache/Dashboard/package-lock.json

    # Framework-dependent, RID-less (AnyCPU) build: requires the .NET 10 runtime (ASP.NET Core runtime for the
    # server) on the target machine and runs on any OS/architecture via `dotnet FrozenCache.dll`.
    - name: Publish FrozenCache (portable)
      run: dotnet publish FrozenCache/FrozenCache/FrozenCache.csproj -c Release -f net10.0 -p:PublishAot=false -p:UseAppHost=false -o publish/portable/FrozenCache

    - name: Publish PerfTest (portable)
      run: dotnet publish FrozenCache/PerfTest/PerfTest.csproj -c Release -f net10.0 -p:PublishAot=false -p:UseAppHost=false -o publish/portable/PerfTest

    - name: Upload portable binaries
      uses: actions/upload-artifact@v4
      with:
        name: portable-binaries
        path: publish/portable
