[package]
name = "frozencache-client"
description = "Rust client for the FrozenCache server (wire-compatible with the .NET CacheClient)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync"] }
# TLS without a C toolchain: rustls with the ring backend, certificates checked against the OS trust store
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"
lru = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
