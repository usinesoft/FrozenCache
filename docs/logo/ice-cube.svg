<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FrozenCache">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f5ff"/>
      <stop offset="1" stop-color="#a6dcfb"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cb8f0"/>
      <stop offset="1" stop-color="#3f8fdc"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86d6"/>
      <stop offset="1" stop-color="#1f5fb0"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-width="3">
    <!-- isometric cube: a block of frozen data -->
    <polygon points="32,5 57,19 32,33 7,19" fill="url(#top)" stroke="url(#top)"/>
    <polygon points="7,19 32,33 32,60 7,46" fill="url(#left)" stroke="url(#left)"/>
    <polygon points="32,33 57,19 57,46 32,60" fill="url(#right)" stroke="url(#right)"/>
  </g>
  <!-- frost: gloss streaks on the front faces, a crisp top edge -->
  <polygon points="11,25 15,27.3 15,44 11,41.7" fill="#ffffff" opacity="0.35"/>
  <polygon points="18,29 20,30.2 20,40 18,38.8" fill="#ffffff" opacity="0.22"/>
  <polygon points="51,26 53,24.9 53,32 51,33.1" fill="#ffffff" opacity="0.18"/>
  <path d="M7 19L32 33L57 19" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>
  <!-- sparkle -->
  <path d="M22 11.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="#ffffff"/>
</svg>
